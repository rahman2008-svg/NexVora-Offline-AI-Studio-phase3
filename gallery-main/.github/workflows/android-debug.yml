name: Android Debug APK

# Builds an installable debug APK and uploads it as a workflow artifact.
# Nothing is published or released by this workflow.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Android/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Android/**"

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: NexVora-Offline-AI-Studio

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Platform 37 and accept licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SRC=app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC" || { echo "::error::Debug APK not found at $SRC"; ls -R app/build/outputs || true; exit 1; }
          DEST="${APP_NAME}-${VERSION}-debug.apk"
          cp "$SRC" "$DEST"
          echo "file=Android/src/$DEST" >> "$GITHUB_OUTPUT"
          echo "### Debug APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`$DEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "$DEST" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Offline-AI-Studio-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 14
