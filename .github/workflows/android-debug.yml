name: NexVora Offline AI Studio - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Android/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

concurrency:
  group: nexvora-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: NexVora-Offline-AI-Studio

jobs:
  build-debug:
    name: Build and Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: Android/src

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          DEST="${APP_NAME}-${VERSION}-debug.apk"
          cp "$SRC" "$DEST"
          echo "file=Android/src/$DEST" >> "$GITHUB_OUTPUT"
          echo "### APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $DEST" >> "$GITHUB_STEP_SUMMARY"
          du -h "$DEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Offline-AI-Studio-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}-${{ github.run_attempt }}
          name: NexVora Offline AI Studio Debug ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
