name: Android Release APK

# Manual only. Builds a SIGNED release APK using GitHub Secrets and uploads it as an artifact.
# This workflow never creates a GitHub Release, tag, or store upload.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NEXVORA_KEYSTORE_BASE64    base64 of your .jks/.keystore file
#   NEXVORA_KEYSTORE_PASSWORD  keystore password
#   NEXVORA_KEY_ALIAS          key alias
#   NEXVORA_KEY_PASSWORD       key password
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: NexVora-Offline-AI-Studio

jobs:
  build-release:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Check signing secrets
        id: secrets
        working-directory: .
        env:
          KS: ${{ secrets.NEXVORA_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.NEXVORA_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.NEXVORA_KEY_ALIAS }}
          KP: ${{ secrets.NEXVORA_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ]  && missing="$missing NEXVORA_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing NEXVORA_KEYSTORE_PASSWORD"
          [ -z "$KA" ]  && missing="$missing NEXVORA_KEY_ALIAS"
          [ -z "$KP" ]  && missing="$missing NEXVORA_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Add these repository secrets, then run again:$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Platform 37 and accept licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Decode keystore (temporary file outside the workspace)
        env:
          KS: ${{ secrets.NEXVORA_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/nexvora-release.keystore"
          echo "NEXVORA_KEYSTORE_FILE=$RUNNER_TEMP/nexvora-release.keystore" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed Release APK
        env:
          NEXVORA_KEYSTORE_PASSWORD: ${{ secrets.NEXVORA_KEYSTORE_PASSWORD }}
          NEXVORA_KEY_ALIAS: ${{ secrets.NEXVORA_KEY_ALIAS }}
          NEXVORA_KEY_PASSWORD: ${{ secrets.NEXVORA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature and name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          DIR=app/build/outputs/apk/release
          SRC=$(ls "$DIR"/*.apk 2>/dev/null | head -n1 || true)
          test -n "$SRC" || { echo "::error::No release APK found in $DIR"; ls -R app/build/outputs || true; exit 1; }
          case "$SRC" in *unsigned*) echo "::error::APK is unsigned: $SRC"; exit 1;; esac
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$SRC"
          DEST="${APP_NAME}-${VERSION}-release.apk"
          cp "$SRC" "$DEST"
          echo "file=Android/src/$DEST" >> "$GITHUB_OUTPUT"
          echo "### Signed Release APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`$DEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "$DEST" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Offline-AI-Studio-release-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nexvora-release.keystore"
